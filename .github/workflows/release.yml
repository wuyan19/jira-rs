name: Release

on:
  push:
    tags: ["v*"]
  # Run the installer smoke tests against a release that already exists,
  # without rebuilding or republishing it.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test the installers against (e.g. v0.1.1)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `jira upgrade` compares its compiled-in version with the release tag. A
  # mismatch would make every install look perpetually outdated (or too new).
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

  # Assets are bare binaries plus a sha256sum-format checksum, not archives:
  # neither the installers nor `jira upgrade` then need an unpacker, and the
  # logic is identical on every platform.
  build:
    if: github.event_name == 'push'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
          # Xcode cross-compiles to Intel from the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust (latest stable)
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      # The C parts of `ring` need a musl compiler for the static builds.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p jira-app
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          asset="jira-${GITHUB_REF_NAME#v}-${TARGET}${EXT}"
          mkdir -p dist
          cp "target/${TARGET}/release/jira${EXT}" "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum --check *.sha256)
          {
            cat scripts/release-notes.md
            echo
            echo "## Changelog"
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md
          # Idempotent, so a re-run refreshes the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "jira ${TAG#v}" --notes-file notes.md
          fi

  # Run the real installers on every platform against the published release,
  # then self-update in place. The Linux and macOS paths are not executed
  # anywhere else.
  smoke:
    needs: release
    # Also on a manual run, where the jobs above are skipped by design.
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Installer scripts come from the ref this workflow runs on (the tag
      # itself on a release push, a branch on a manual run), so a fix to
      # the installers can be checked against an existing release.
      SCRIPTS_REF: ${{ github.ref_name }}
      RAW: https://raw.githubusercontent.com/${{ github.repository }}
      DOWNLOAD: ${{ github.server_url }}/${{ github.repository }}/releases/download
    steps:
      - name: Install via install.sh
        if: runner.os != 'Windows'
        env:
          JIRA_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh -c "$(curl -fsSL "$RAW/$SCRIPTS_REF/scripts/install.sh")"
          "$JIRA_INSTALL_DIR/jira" --version

      # `file` words differ per target ("statically linked" on aarch64,
      # "static-pie linked" on x86_64); what matters is that nothing is
      # dynamically linked.
      - name: Linux binaries have no shared-library dependencies
        if: runner.os == 'Linux'
        run: |
          file "$RUNNER_TEMP/bin/jira"
          if readelf -d "$RUNNER_TEMP/bin/jira" | grep -q NEEDED; then
            echo "::error::the binary depends on shared libraries"
            exit 1
          fi

      - name: Self-update (install.sh platforms)
        if: runner.os != 'Windows'
        env:
          JIRA_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          "$JIRA_INSTALL_DIR/jira" upgrade --force
          "$JIRA_INSTALL_DIR/jira" --version

      # Only right after a release is the tested tag known to be the latest.
      - name: upgrade --check reports up to date
        if: github.event_name == 'push' && runner.os != 'Windows'
        env:
          JIRA_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          "$JIRA_INSTALL_DIR/jira" upgrade --check | grep -q up_to_date

      # The Intel build is cross-compiled and otherwise never executed.
      # Not blocking: depends on Rosetta being present on the runner.
      - name: Intel build runs on Apple Silicon (Rosetta)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          intel="$RUNNER_TEMP/jira-intel"
          curl -fsSL -o "$intel" "$DOWNLOAD/$TAG/jira-${TAG#v}-x86_64-apple-darwin"
          chmod +x "$intel"
          arch -x86_64 "$intel" --version

      # Windows PowerShell 5.1: what a stock Windows ships with.
      - name: Install via install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:JIRA_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          irm "$env:RAW/$env:SCRIPTS_REF/scripts/install.ps1" | iex
          & "$env:RUNNER_TEMP\bin\jira.exe" --version

      - name: Windows installer adds its directory to the user PATH
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not ($userPath -split ';' | Where-Object { $_ -eq "$env:RUNNER_TEMP\bin" })) {
            throw "user PATH does not contain $env:RUNNER_TEMP\bin : $userPath"
          }

      # The binary users actually get, in a stock Windows PowerShell.
      - name: Output encoding in Windows PowerShell 5.1 (installed binary)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $test = "$env:RUNNER_TEMP\test-output-encoding.ps1"
          Invoke-WebRequest -Uri "$env:RAW/$env:SCRIPTS_REF/scripts/test-output-encoding.ps1" -OutFile $test -UseBasicParsing
          & powershell -NoProfile -ExecutionPolicy Bypass -File $test -Jira "$env:RUNNER_TEMP\bin\jira.exe" -Work "$env:RUNNER_TEMP\encoding"
          if ($LASTEXITCODE -ne 0) { throw "the output-encoding test exited $LASTEXITCODE" }

      - name: upgrade --check reports up to date (Windows)
        if: github.event_name == 'push' && runner.os == 'Windows'
        shell: powershell
        run: |
          $report = & "$env:RUNNER_TEMP\bin\jira.exe" upgrade --check
          if (-not ($report -match 'up_to_date')) { throw "upgrade --check reported: $report" }

      - name: Self-update (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $jira = "$env:RUNNER_TEMP\bin\jira.exe"
          & $jira upgrade --force
          if ($LASTEXITCODE -ne 0) { throw "upgrade --force exited $LASTEXITCODE" }
          & $jira --version
