name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One of each platform family `jira` ships for; the release workflow
        # covers the remaining targets by cross-compiling.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust (latest stable)
        run: rustup toolchain install stable --profile minimal
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # PowerShell's parser accepts anything between brackets, so a misspelled
      # .NET type only fails at run time, in whatever branch uses it.
      - name: install.ps1 static checks (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Join-Path $PWD 'scripts\install.ps1'
          $text = Get-Content -Raw $path
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw "parse errors: $($errors | ForEach-Object { $_.Message })" }
          if ($text -match '[^\x00-\x7F]') { throw 'install.ps1 must stay ASCII: PowerShell 5.1 reads BOM-less files as the ANSI code page' }
          $names = [regex]::Matches($text, '\[((?:[A-Za-z_]\w*\.)+[A-Za-z_]\w*)\]') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique |
              Where-Object { $_ -notlike 'JiraInstall.*' }   # created at run time by Add-Type
          $missing = @()
          foreach ($name in $names) {
              try { [void][type]$name } catch { $missing += $name }
          }
          "type names referenced: $($names -join ', ')"
          if ($missing) { throw "type names that do not resolve: $($missing -join ', ')" }
