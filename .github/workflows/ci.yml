name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One of each platform family `jira` ships for; the release workflow
        # covers the remaining targets by cross-compiling.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Rust (latest stable)
        run: rustup toolchain install stable --profile minimal
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # CLI output must go through src/output.rs, which picks the encoding
      # PowerShell decodes with; a raw print macro would bypass it.
      - name: No raw print macros in the CLI modules
        shell: bash   # the default shell on Windows runners is pwsh
        run: |
          ! grep -nE '\b(e?print|e?println)!\(' crates/jira-app/src/cli.rs crates/jira-app/src/upgrade.rs
      # Chinese text must survive `& jira ... | ConvertFrom-Json` with nothing
      # configured, in both PowerShell generations (see src/output.rs).
      - name: Output encoding in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-output-encoding.ps1 -Jira ./target/debug/jira.exe -Work "$env:RUNNER_TEMP/encoding-51"
      - name: Output encoding in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-output-encoding.ps1 -Jira ./target/debug/jira.exe -Work "$env:RUNNER_TEMP/encoding-7"
      # PowerShell's parser accepts anything between brackets, so a misspelled
      # .NET type only fails at run time, in whatever branch uses it.
      - name: PowerShell scripts static checks (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in (Get-ChildItem scripts/*.ps1)) {
              $text = Get-Content -Raw $path
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count) { throw "$($path.Name): parse errors: $($errors | ForEach-Object { $_.Message })" }
              if ($text -match '[^\x00-\x7F]') { throw "$($path.Name) must stay ASCII: PowerShell 5.1 reads BOM-less files as the ANSI code page" }
              $names = [regex]::Matches($text, '\[((?:[A-Za-z_]\w*\.)+[A-Za-z_]\w*)\]') |
                  ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique |
                  Where-Object { $_ -notlike 'JiraInstall.*' }   # created at run time by Add-Type
              foreach ($name in $names) {
                  try { [void][type]$name } catch { throw "$($path.Name): type name does not resolve: $name" }
              }
              "$($path.Name): $($names.Count) type names resolve"
          }
